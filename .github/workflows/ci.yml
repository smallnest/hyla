name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Test
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./internal/...
      - name: Build for every platform
        run: |
          set -eu
          for os in linux darwin windows; do
            GOOS=$os go build ./...
          done
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/hyla-server
      - name: Check the install scripts
        run: |
          sh -n scripts/install-server.sh
          sh -n scripts/build-server.sh
          pwsh -NoProfile -Command '$e = $null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/install-server.ps1), [ref]$null, [ref]$e) | Out-Null; if ($e) { $e; exit 1 }'

  # The server build, built and run on each of its platforms.
  server:
    name: Server
    uses: ./.github/workflows/server.yml

  # libghostty-vt, which the terminal downloads from the release of mygo's
  # plugin as a terminal is first made. Kept, so that the runs of the tests
  # and of the server's Check do not wait on GitHub's release files, which
  # answer with 504 Gateway Timeout at times.
  native:
    name: Native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The library's SHA-256, name and release, as the terminal's manifest
      # names them, where go list says the module is: downloaded by the run
      # before.
      - run: |
          set -eu
          dir="$(go list -m -f '{{.Dir}}' github.com/egoist/mygo)/plugins/terminal"
          jq -r '.libraries[] | select(.name == "libghostty-vt") | .files["linux-amd64"].sha256' "$dir/mygo-plugin.json" > "$RUNNER_TEMP/sha"
          jq -r '.libraries[] | select(.name == "libghostty-vt") | .files["linux-amd64"].name' "$dir/mygo-plugin.json" > "$RUNNER_TEMP/name"
          jq -r '.libraries[] | select(.name == "libghostty-vt") | .files["linux-amd64"].url' "$dir/mygo-plugin.json" |
            sed 's|.*/download/||; s|/.*||' > "$RUNNER_TEMP/tag"
          echo "sha=$(cat "$RUNNER_TEMP/sha")" >> "$GITHUB_ENV"
          echo "lib=$(cat "$RUNNER_TEMP/name")" >> "$GITHUB_ENV"
          echo "tag=$(cat "$RUNNER_TEMP/tag")" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: ~/.cache/mygo/natives
          key: native-${{ env.sha }}
      - name: Download
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p "$HOME/.cache/mygo/natives/$sha"
          # Asked for by gh, which reaches the release's file where curl of
          # its link does not at times, and again a moment later.
          for i in 0 15 30 60; do
            sleep "$i"
            gh release download "$tag" --repo egoist/mygo \
              --pattern "$lib" --dir "$HOME/.cache/mygo/natives/$sha" --clobber && break
          done
          test -s "$HOME/.cache/mygo/natives/$sha/$lib"
      - uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/mygo/natives
          key: native-${{ env.sha }}
