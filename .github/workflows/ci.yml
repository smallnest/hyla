name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Test
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./internal/...
      - name: Build for every platform
        run: |
          set -eu
          for os in linux darwin windows; do
            GOOS=$os go build ./...
          done
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/hyla-server
      - name: Check the install scripts
        run: |
          sh -n scripts/install-server.sh
          sh -n scripts/build-server.sh
          pwsh -NoProfile -Command '$e = $null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/install-server.ps1), [ref]$null, [ref]$e) | Out-Null; if ($e) { $e; exit 1 }'

  # The server build, built and run on each of its platforms.
  server:
    name: Server
    uses: ./.github/workflows/server.yml

  # libghostty-vt, which the terminal downloads from the release of mygo's
  # plugin as a terminal is first made. Kept, so that the runs of the tests
  # do not wait on GitHub's release files, which answer with 504 Gateway
  # Timeout at times.
  native:
    name: Native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The library's SHA-256 and name, and the release it comes from: the
      # SHA-256 is where the terminal keeps the library it downloads, and a
      # part of this step's key.
      - id: lib
        run: |
          set -eu
          dir="$(go list -m -f '{{.Dir}}' github.com/egoist/mygo)/plugins/terminal"
          jq -r '.libraries[] | select(.name == "libghostty-vt") | .files["linux-amd64"].sha256' "$dir/mygo-plugin.json" > "$RUNNER_TEMP/sha"
          # The file's name in the release, which gh matches: the manifest
          # names the file the program loads, which the release names by
          # platform.
          jq -r '.libraries[] | select(.name == "libghostty-vt") | .files["linux-amd64"].url | split("/") | last' "$dir/mygo-plugin.json" > "$RUNNER_TEMP/asset"
          jq -r '.libraries[] | select(.name == "libghostty-vt") | .files["linux-amd64"].name' "$dir/mygo-plugin.json" > "$RUNNER_TEMP/name"
          # The release that holds the file, whose URL is
          # https://github.com/<owner>/<repo>/releases/download/<tag>/<file>.
          jq -r '.libraries[] | select(.name == "libghostty-vt") | .files["linux-amd64"].url' "$dir/mygo-plugin.json" > "$RUNNER_TEMP/url"
          sed 's|.*/releases/download/||; s|/.*||' "$RUNNER_TEMP/url" > "$RUNNER_TEMP/tag"
          echo "sha=$(cat "$RUNNER_TEMP/sha")" >> "$GITHUB_OUTPUT"
          echo "asset=$(cat "$RUNNER_TEMP/asset")" >> "$GITHUB_OUTPUT"
          echo "name=$(cat "$RUNNER_TEMP/name")" >> "$GITHUB_OUTPUT"
          echo "tag=$(cat "$RUNNER_TEMP/tag")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: ~/.cache/mygo/natives
          key: native-${{ steps.lib.outputs.sha }}
      - name: Download
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.lib.outputs.sha }}
          ASSET: ${{ steps.lib.outputs.asset }}
          NAME: ${{ steps.lib.outputs.name }}
          TAG: ${{ steps.lib.outputs.tag }}
        run: |
          set -eu
          dir="$HOME/.cache/mygo/natives/$SHA"
          mkdir -p "$dir"
          # Asked for by gh, which reaches the release's file where curl of
          # its link does not at times, and again a moment later.
          for i in 0 15 30 60; do
            sleep "$i"
            gh release download "$TAG" --repo egoist/mygo --pattern "$ASSET" --dir "$dir" --clobber && break
          done
          mv "$dir/$ASSET" "$dir/$NAME"
          echo "$SHA  $dir/$NAME" | sha256sum -c -
      - uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/mygo/natives
          key: native-${{ steps.lib.outputs.sha }}
