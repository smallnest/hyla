api_version = 1
id = "hyla.pomodoro"
name = "Pomodoro"
version = "1.0.1"
description = "Refined Pomodoro focus timer pane with radial watch dial, task queue estimator, 7-day focus analytics, Web Audio chimes & ambient soundscapes, and desktop notifications."
author = "Hyla"
homepage = "https://github.com/smallnest/hyla/tree/master/plugins/pomodoro"

[engines]
hyla = ">=3.20.0"

[permissions]
scopes = ["ui.webview", "ui.slot", "session.read", "notifications"]

[app]
command = ["./bin/hyla-pomodoro"]
transport = "stdio"
auto_start = true

[[actions]]
id = "open"
title = "Open Pomodoro Pane"
menu = "Pane"
shortcut = "CmdOrCtrl+Alt+O"
palette = true
remote = true
target = "app"
view = "pomodoro"

[[ui.slots]]
id = "pomodoro"
mount = "pane"
title = "Pomodoro"
mode = "webview"
host = "app"
web_root = "web"
entry = "index.html"
order = 40

[[settings]]
key = "pomodoro_minutes"
title = "Pomodoro (minutes)"
description = "Duration of a single focus session in minutes"
type = "integer"
default = 25

[[settings]]
key = "short_break_minutes"
title = "Short Break (minutes)"
description = "Duration of a short break in minutes"
type = "integer"
default = 5

[[settings]]
key = "long_break_minutes"
title = "Long Break (minutes)"
description = "Duration of a long break in minutes"
type = "integer"
default = 15

[[settings]]
key = "long_break_interval"
title = "Long Break Interval"
description = "Number of completed focus sessions before a long break"
type = "integer"
default = 4

[[settings]]
key = "auto_start_breaks"
title = "Auto-start Breaks"
description = "Automatically begin the break timer when a focus session completes"
type = "boolean"
default = false

[[settings]]
key = "auto_start_pomodoros"
title = "Auto-start Pomodoros"
description = "Automatically begin the next focus session when a break ends"
type = "boolean"
default = false

[[settings]]
key = "alarm_sound"
title = "Alarm Sound"
description = "Chime synthesized locally when a timer completes"
type = "select"
default = "bell"
options = ["bell", "bowl", "marimba", "digital", "none"]

[[settings]]
key = "alarm_volume"
title = "Alarm Volume (%)"
description = "Volume for completion chimes (0–100)"
type = "integer"
default = 70

[[settings]]
key = "alarm_repeat"
title = "Alarm Repeat"
description = "Number of times to play the completion chime (1–5)"
type = "integer"
default = 2

[[settings]]
key = "ambient_sound"
title = "Ambient Focus Sound"
description = "Subtle background soundscape played during focus sessions"
type = "select"
default = "none"
options = ["none", "white", "rain", "brown", "tick"]

[[settings]]
key = "ambient_volume"
title = "Ambient Volume (%)"
description = "Volume for ambient focus soundscape (0–100)"
type = "integer"
default = 55

[[settings]]
key = "desktop_notifications"
title = "Desktop Notifications"
description = "Send a Hyla notification when a focus session or break finishes"
type = "boolean"
default = true

[[settings]]
key = "daily_goal_pomos"
title = "Daily Goal (Pomodoros)"
description = "Target number of focus sessions per day shown in the Report view"
type = "integer"
default = 8

