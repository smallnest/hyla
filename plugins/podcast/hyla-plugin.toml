api_version = 1
id = "hyla.podcast"
name = "Podcast"
version = "1.0.0"
description = "Podcast player pane with RSS/Apple/Xiaoyuzhou subscriptions, curated discovery, bilingual transcripts, AI guide & Q&A, vocabulary notebook, offline cache, and coding-agent auto-pause."
author = "Hyla"

[engines]
hyla = ">=3.20.0"

[permissions]
scopes = ["ui.webview", "ui.slot", "session.read", "network", "secrets"]

[app]
command = ["./bin/hyla-podcast"]
transport = "stdio"
auto_start = true

[[actions]]
id = "open"
title = "Open Podcast Pane"
menu = "Pane"
shortcut = "CmdOrCtrl+Alt+P"
palette = true
remote = true
target = "app"
view = "podcast"

[[ui.slots]]
id = "podcast"
mount = "pane"
title = "Podcast"
mode = "webview"
host = "app"
web_root = "web"
entry = "index.html"
order = 20

[[settings]]
key = "auto_pause_on_agent"
title = "Auto-pause when agent finishes"
description = "Pause podcast playback when a coding agent in Hyla finishes working"
type = "boolean"
default = true

[[settings]]
key = "ai_provider"
title = "AI Provider"
description = "Model provider preset for AI guide, Q&A, and optional translation"
type = "select"
default = "deepseek"
options = ["deepseek", "openai", "openrouter", "siliconflow", "kimi", "ollama", "custom"]

[[settings]]
key = "ai_base_url"
title = "AI Base URL"
description = "Optional custom OpenAI-compatible API endpoint (overrides provider default)"
type = "string"
default = ""
placeholder = "https://api.deepseek.com/v1"

[[settings]]
key = "ai_model"
title = "AI Model"
description = "Optional custom model name (overrides provider default)"
type = "string"
default = ""
placeholder = "deepseek-chat"

[[settings]]
key = "ai_api_key"
title = "AI API Key"
description = "Stored securely in the system keychain"
type = "secret"
placeholder = "sk-..."

[[settings]]
key = "translate_engine"
title = "Translation Engine"
description = "Engine used to translate podcast transcripts"
type = "select"
default = "google"
options = ["google", "ai"]

[[settings]]
key = "asr_base_url"
title = "Cloud ASR Base URL"
description = "OpenAI-compatible transcription API endpoint (e.g. Groq or SiliconFlow)"
type = "string"
default = ""
placeholder = "https://api.groq.com/openai/v1"

[[settings]]
key = "asr_model"
title = "Cloud ASR Model"
description = "Model name for cloud audio transcription"
type = "string"
default = "whisper-large-v3-turbo"
placeholder = "whisper-large-v3-turbo"

[[settings]]
key = "asr_api_key"
title = "Cloud ASR API Key"
description = "API key for cloud transcription (falls back to AI API Key if empty)"
type = "secret"
placeholder = "gsk_..."

[[settings]]
key = "http_proxy"
title = "HTTP Proxy"
description = "Optional proxy URL for feeds, audio streams, and AI requests"
type = "string"
default = ""
placeholder = "http://127.0.0.1:7890"

[i18n.zh-Hans]
name = "播客"
description = "播客窗格插件：支持 RSS / Apple Podcasts / 小宇宙订阅、精选发现、双语字幕、AI 导读与问答、生词本、离线缓存及编程 Agent 完成时自动暂停。"

[i18n.zh-Hans.actions]
open = "打开播客窗格"

