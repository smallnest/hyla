<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Podcast</title>
  <link rel="stylesheet" href="/_hyla/theme.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar" id="topbar">
      <nav class="nav-tabs" id="nav-tabs" aria-label="Podcast navigation"></nav>
      <div class="topbar-right">
        <span class="job-pill" id="job-pill" hidden></span>
        <button class="icon-btn" id="refresh-btn" type="button" title="Refresh"></button>
        <button class="icon-btn" id="settings-btn" type="button" title="Settings"></button>
      </div>
    </header>
    <div class="banner" id="banner" hidden></div>
    <main class="main" id="main"></main>
    <footer class="mini-player" id="mini-player" hidden></footer>
  </div>
  <div class="modal-backdrop" id="modal-backdrop" hidden></div>
  <audio id="audio-el" preload="metadata"></audio>
  <script src="/_hyla/bridge.js"></script>
  <script src="app.js"></script>
</body>
</html>
